services:
  pihole:
    image: pihole/pihole:latest
    ports:
      - "${DNS_PORT}:53/tcp"
      - "${DNS_PORT}:53/udp"
      - "${WEB_PORT}:80/tcp"
    environment:
      TZ: ${TZ}
      FTLCONF_webserver_api_password: ${WEB_PASSWORD}
      FTLCONF_dns_listeningMode: ALL
    volumes:
      - ${APP_DATA}/etc-pihole:/etc/pihole
    cap_add:
      - SYS_NICE
    restart: unless-stopped
